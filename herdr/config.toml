onboarding = false

[ui.toast]
delivery = "terminal"
# only notify if the agent is still in the same state after 5 s:
# whatever unblocks itself does not interrupt you
delay_seconds = 5

[ui.sound]
# Own mp3s, made from macOS system sounds lowered 8 dB (see sounds/make-sounds.sh).
# Paths are relative to this file. Swap the mp3 to change the cue.
# "request" is herdr's name for the needs-attention state (the post calls it blocked).
done_path    = "sounds/done-purr.mp3"      # the agent finished
request_path = "sounds/request-tink.mp3"   # the agent needs you

[theme]
name = "vesper"
auto_switch = false

# Actions herdr ships unbound. Ghostty triggers them through the prefix.
[keys]
previous_workspace = "prefix+a"
next_workspace     = "prefix+shift+a"
previous_agent     = "prefix+d"
next_agent         = "prefix+f"
last_pane          = "prefix+u"

[ui]
status_indicators = "symbols"
